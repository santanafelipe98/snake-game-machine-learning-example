<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - ML </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <main>
        <div id="hud">
            <span id="score_text">Score: 0</span>
            <span id="highscore_text">Highscore: 0</span>
        </div>
        <div id="screen">
            <canvas id="viewport" width="640" height="512"></canvas>
            <div id="gameover_screen" class="d-none">
                <h1 id="gameover_text">Game over!</h1>
                <h4>Press R to restart</h4>
            </div>
        </div>
        <input id="webcam_enable" type="checkbox" name="webcam_enable">
        <label for="webcam_enable">Use webcam as controller <small>(use your head)</small></label>
        <div id="webcam-container" class="d-none"></div>
        <div id="label-container" class="d-none"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
